[alias]
xtask = "run --quiet --locked --package logit-loom-xtask --"

[build]
# `-Zmacro-backtrace=yes` makes a macro- or build.rs-generated obligation that
# fails as a bare E0277 inside OUT_DIR diagnosable rather than a puzzle. Requires
# nightly, which is the build host's policy.
#
# `unreachable_pub` is NOT set here. It lives in [workspace.lints.rust] in
# Cargo.toml, which reaches workspace MEMBERS only. The -Zcrate-attr form was
# tried and reverted: rustflags apply to every unit the build compiles, and path
# dependencies are NOT shielded by --cap-lints allow. This repo can be
# path-depended on by other workspaces, so a crate-attr here would impose this
# repo's lint policy on all of them. Note a member lacking
# `[lints] workspace = true` silently opts out of EVERY workspace lint.
#
# Never move rustflags into a [target.<triple>] block: a target block REPLACES
# build.rustflags wholesale. That trap hid `-Dwarnings` machine-wide for months.
rustflags = [
    "-Zmacro-backtrace=yes",
]
