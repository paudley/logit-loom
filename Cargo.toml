# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "3"
members = [
    "models",
    "crates/core",
    "crates/diffusion",
    "crates/diffusion-sdcpp",
    "crates/executor",
    "crates/loom",
    "crates/llamacpp",
    "crates/runtime",
    "crates/tokenizer",
    "xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Blackcat Informatics Inc."]
license = "MIT OR Apache-2.0"
repository = "https://github.com/paudley/logit-loom"
homepage = "https://github.com/paudley/logit-loom"

[workspace.dependencies]
blake3 = "1.8.5"
llama-cpp-4 = { version = "=0.4.2", git = "https://github.com/paudley/llama-cpp-rs.git", rev = "d76356b9725a3736212b3bfd16c66fc80c995c29", default-features = false }
libloading = "0.8.9"
logit-loom = { version = "=0.2.0", path = "crates/loom" }
logit-loom-core = { version = "=0.2.0", path = "crates/core" }
logit-loom-diffusion = { version = "=0.2.0", path = "crates/diffusion" }
logit-loom-diffusion-sdcpp = { version = "=0.2.0", path = "crates/diffusion-sdcpp" }
logit-loom-executor = { version = "=0.2.0", path = "crates/executor" }
logit-loom-llamacpp = { version = "=0.2.0", path = "crates/llamacpp" }
logit-loom-models = { version = "=0.2.0", path = "models" }
logit-loom-tokenizer = { version = "=0.2.0", path = "crates/tokenizer" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.19"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
wide = "=0.7.33"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = "line-tables-only"
